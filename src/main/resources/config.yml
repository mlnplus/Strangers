# Default language: en
language: en
enabled: true

# Skin to apply to everyone.
# It can dynamically fetch a skin from Mojang API using a player name.
# Default is "MHF_Question" (a standard question mark block skin) or "Stranger" or "Anonymous".
skin-player-name: "Velenci"

# If Mojang API fetching fails or if you want to hardcode a specific skin texture,
# paste the base64 value and signature below. If these are not empty, they will override skin-player-name.
fallback-skin-player-name: "Velenci"
fallback-skin-value: ""
fallback-skin-signature: ""

# Voice Changer Settings (Simple Voice Chat Hook)
voice-changer:
  enabled: true
  # The pitch ratio. 1.0 is normal, < 1.0 is lower pitch (deeper), > 1.0 is higher pitch.
  # A pitch of 0.6 to 0.7 makes a very deep trolling voice.
  pitch-ratio: 0.67
  # The window size in milliseconds for the delay-line crossfader (20ms to 40ms is standard).
  window-ms: 30

# Death Action Settings
death-action:
  # Mode options: BAN, KICK, NONE
  # BAN  = Bans the player by name and kicks them from the server
  # KICK = Kicks the player from the server without banning
  # NONE = Does not ban or kick (just plays the death reveal animation)
  mode: "BAN"

# Death Title & Animation Settings
death-title:
  enabled: true                  # Set to false to disable the death title reveal animation
  scramble-color: "&#330a0a"      # Dark ash/blood shadow color for matrix cipher scrambling
  revealed-color: "&#ff0033"      # Glowing intense blood red color for revealed letters
  final-title-format: "<gradient:#ff2a2a:#990000:#400000><bold>{NAME}</bold></gradient>" # Dramatic 3-stage blood execution title

# Lives System Settings
lives-system:
  enabled: true
  default-lives: 3
  pvp-only: true
  # When true, broadcasts a death message in chat when a life is lost
  broadcast-life-lost: true
  # When true, reveals the player's real name in the broadcast (e.g. "mlnplus lost a life").
  # When false, keeps them anonymous (e.g. "Stranger lost a life") until fully eliminated.
  reveal-name-on-death: true
  # Sound effect played when a player loses a life
  life-lost-sound:
    enabled: true
    sound: "ENTITY_WARDEN_HEARTBEAT"
    volume: 1.2
    pitch: 0.8
    broadcast-to-all: true

# Game & Event Settings (Start & Reset commands)
game:
  # Target world for border and scatter (leave empty to use sender's world or primary overworld)
  world: ""
  # World border diameter in blocks (8000 = 4000 blocks in each direction from center)
  border-size: 8000.0
  border-center-x: 0.0
  border-center-z: 0.0
  # Border size restored when /strangers reset is used (vanilla maximum border size is 59999968)
  reset-border-size: 59999968.0
  # Safety margin in blocks kept away from the world border edge when scattering players
  scatter-safe-margin: 200.0
  # Minimum distance in blocks between scattered players so they are well distributed across the map
  min-player-distance: 800.0
  # Duration in seconds of Resistance protection given to players after scatter teleport
  teleport-protection-seconds: 10
  # Cinematic countdown before player scatter in seconds (0 to disable)
  countdown-seconds: 3
  # Audio-visual fancy teleport effects and particle bursts
  fancy-teleport-effects: true
  # Multi-stage cinematic event titles
  cinematic-titles: true
  # When resetting the game, disable Strangers anonymization
  reset-disable-strangers: true
  # When resetting the game, restore all player lives to default
  reset-restore-lives: true
  # When resetting the game, unban players eliminated by Strangers
  reset-pardon-eliminated: true

# Actionbar Display Settings
actionbar:
  enabled: true
  # Displays color-coded heart icons: 3 = Yellow, 2 = Red, 1 = Black
  format: "{HEARTS}"
  hearts:
    three: "<#ffd700>❤ ❤ ❤</#ffd700>"
    two: "<#ff3333>❤ ❤</#ff3333>"
    one: "<#8b0000>❤</#8b0000>"
    zero: "<dark_gray>☠</dark_gray>"

# Revive Book Recipe Settings
# Identity Tracker Name Tag Configuration
# Allows players to craft a mystical name tag, bind it to a non-eliminated player via GUI,
# and activate a 5-minute directional tracking & identity reveal session.
nametag-tracker:
  enabled: true
  # Duration in seconds of the tracking and identity reveal effect (Default: 300 = 5 minutes)
  duration-seconds: 300
  # Interval in ticks between direction and particle updates (Default: 10 ticks = 0.5s)
  particle-interval-ticks: 10
  # Particle type used to indicate direction towards target (RED_DUST, SOUL_FIRE_FLAME, BUBBLE_POP, END_ROD, GLOW, etc.)
  particle-type: "RED_DUST"
  # Spawn an ambient directional particle bubble swirl around the tracker player
  particle-bubble: false
  # Render glowing outline on the target player while actively tracked (disabled per user request)
  target-glow: false
  # Display HUD type for tracker: BOSSBAR, ACTIONBAR, or BOTH
  hud-type: "BOSSBAR"
  # Render pulsing red vignette on the target player screen while tracked
  target-vignette: true
  # Display BossBar to the target player indicating they are being hunted
  target-bossbar: true
  # Display title warning to the target player when they start being hunted
  target-title: true
  # Crafting recipe configuration
  recipe:
    enabled: true
    shape:
      - "ECE"
      - "CNC"
      - "ECE"
    ingredients:
      N: "NAME_TAG"
      E: "ENDER_EYE"
      C: "COMPASS"

revive-recipe:
  enabled: true
  shape:
    - "NNN"
    - "ESE"
    - "NBN"
  ingredients:
    N: "NETHERITE_INGOT"
    E: "ENCHANTED_GOLDEN_APPLE"
    S: "NETHER_STAR"
    B: "BOOK"

# Anonymity & Privacy Settings
anonymity:
  # Name displayed for anonymous players (can also be overridden per language under messages.<lang>.anonymous-name)
  name: "Stranger"

# Advancement Announcements
advancements:
  # Options: ANONYMOUS, HIDE, ALLOW
  # ANONYMOUS = Replaces real player names with Stranger/Ismeretlen in advancement announcements
  # HIDE      = Completely silences advancement messages in chat
  # ALLOW     = Vanilla behavior (real names shown)
  mode: "ANONYMOUS"

# Multiplayer Server List Ping
server-list:
  # When true, hides the online player sample tooltip in the multiplayer menu so players cannot see who is online
  hide-player-sample: true

# Chat Privacy
chat:
  # When true, automatically masks any online player's real name mentioned in chat messages with Stranger for regular players
  mask-real-names: true

# Commands blocked for non-admin players to prevent player discovery
blocked-commands:
  - "msg"
  - "tell"
  - "w"
  - "whisper"
  - "r"
  - "reply"
  - "me"
  - "list"
  - "team"
  - "trigger"
  - "near"
  - "who"
  - "online"
  - "plist"
  - "listplayers"

