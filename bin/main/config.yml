    revive-book-lore-3: "&a✦ Receives &f1 life &aupon revival."
    revive-gui-title: "&d&lRevive Player"
    gui-status-eliminated: "&7Status: &cEliminated"
    gui-lives: "&7Lives: &c{LIVES}"
    gui-already-revived: "&c❌ Already revived once!"
    gui-revivable: "&a✔ Revivable!"
    gui-click-to-revive: "&eClick to revive!"
    actionbar-format: "&c❤ &fLives: &c&l{LIVES}"
