# Strangers Plugin Configuration
# Default language: en
language: en
enabled: true

# Skin to apply to everyone.
# It can dynamically fetch a skin from Mojang API using a player name.
# Default is "MHF_Question" (a standard question mark block skin) or "Stranger" or "Anonymous".
skin-player-name: "Velenci"

# If Mojang API fetching fails or if you want to hardcode a specific skin texture,
# paste the base64 value and signature below. If these are not empty, they will override skin-player-name.
fallback-skin-player-name: "Velenci"
fallback-skin-value: ""
fallback-skin-signature: ""

# Voice Changer Settings (Simple Voice Chat Hook)
voice-changer:
  enabled: true
  # The pitch ratio. 1.0 is normal, < 1.0 is lower pitch (deeper), > 1.0 is higher pitch.
  # A pitch of 0.6 to 0.7 makes a very deep trolling voice.
  pitch-ratio: 0.67
  # The window size in milliseconds for the delay-line crossfader (20ms to 40ms is standard).
  window-ms: 30

# Death Action Settings
death-action:
  # Mode options: BAN, KICK, NONE
  # BAN  = Bans the player by name and kicks them from the server
  # KICK = Kicks the player from the server without banning
  # NONE = Does not ban or kick (just plays the death reveal animation)
  mode: "BAN"

# Death Title & Animation Settings
death-title:
  enabled: true                  # Set to false to disable the death title reveal animation
  scramble-color: "&#330a0a"      # Dark ash/blood shadow color for matrix cipher scrambling
  revealed-color: "&#ff0033"      # Glowing intense blood red color for revealed letters
  final-title-format: "<gradient:#ff2a2a:#990000:#400000><bold>{NAME}</bold></gradient>" # Dramatic 3-stage blood execution title

# Lives System Settings
lives-system:
  enabled: true
  default-lives: 3
  pvp-only: true

# Actionbar Display Settings
actionbar:
  enabled: true
  format: "&#ff3333❤ &fLives: &c{LIVES}"

# Revive Book Recipe Settings
revive-recipe:
  enabled: true
  shape:
    - "NNN"
    - "ESE"
    - "NBN"
  ingredients:
    N: "NETHERITE_INGOT"
    E: "ENCHANTED_GOLDEN_APPLE"
    S: "NETHER_STAR"
    B: "BOOK"

# Messages Configuration
messages:
  en:
    chat-format: "&7<Stranger> &f{MESSAGE}"
    join-message: "&e✦ &fStranger &7joined the game"
    quit-message: "&e✦ &fStranger &7left the game"
    ban-reason: "&c☠ You ran out of lives! Your identity was revealed."
    kick-reason: "&c☠ You died and your identity was revealed."
    death-subtitle: "&4☠ &c&lDIED &4☠"
    life-lost: "&c💔 You lost a life! &7(Remaining lives: &c&l{LIVES}&7)"
    eliminated-broadcast: "&c☠ &l{NAME} &chas been eliminated!"
    revived-broadcast: "&e&l{NAME} &ahas been revived! &7(by {REVIVER})"
    already-revived: "&cThis player has already been revived once!"
    player-not-eliminated: "&cThis player is not eliminated!"
